name: Pizza Demo QA
on:
  push:
    paths:
      - 'pizza*.html'
      - 'pizza*.js'
      - 'pizza*.css'
      - 'assets/pizza/**'
      - 'tests/pizza-demo-qa.cjs'
      - 'tests/pizza-catalog-qa.mjs'
      - 'tests/pizza-recipe-qa.mjs'
      - 'tests/pizza-menu-qa.mjs'
      - 'tests/pizza-menu-browser-qa.cjs'
      - 'tests/pizza-service-qa.mjs'
      - 'tests/pizza-service-browser-qa.cjs'
      - 'tests/pizza-properties-qa.mjs'
      - 'tests/pizza-city-layout-qa.mjs'
      - 'tests/pizza-city-study-qa.cjs'
      - 'tests/pizza-city-mix-qa.cjs'
      - 'tests/pizza-restaurants-browser-qa.cjs'
      - 'tests/pizza-kitchen-qa.mjs'
      - 'tests/pizza-kitchen-browser-qa.cjs'
      - 'tests/pizza-floorplans-qa.mjs'
      - 'tests/pizza-floorplans-browser-qa.cjs'
      - 'tests/pizza-isometric-art-qa.mjs'
      - '.github/workflows/pizza-demo-qa.yml'
  workflow_dispatch:
jobs:
  pizza-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check the city, restaurant controls and responsive views
        run: |
          node tests/pizza-catalog-qa.mjs
          node tests/pizza-recipe-qa.mjs
          node tests/pizza-menu-qa.mjs
          node tests/pizza-menu-browser-qa.cjs
          node tests/pizza-service-qa.mjs
          node tests/pizza-service-browser-qa.cjs
          node tests/pizza-restaurants-browser-qa.cjs
          node tests/pizza-kitchen-qa.mjs
          node tests/pizza-kitchen-browser-qa.cjs
          node tests/pizza-floorplans-qa.mjs
          node tests/pizza-floorplans-browser-qa.cjs
          node tests/pizza-properties-qa.mjs
          node tests/pizza-city-layout-qa.mjs
          node tests/pizza-isometric-art-qa.mjs
          node tests/pizza-city-study-qa.cjs
          node tests/pizza-city-mix-qa.cjs
          node tests/pizza-demo-qa.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pizza-demo-qa
          path: qa/pizza/
