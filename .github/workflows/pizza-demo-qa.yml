name: Pizza Demo QA
on:
  push:
    paths:
      - 'pizza*.html'
      - 'pizza*.js'
      - 'pizza*.css'
      - 'assets/pizza/**'
      - 'tests/pizza-demo-qa.cjs'
      - 'tests/pizza-editor-browser-qa.cjs'
      - 'tests/pizza-editor-helpers.cjs'
      - 'tests/pizza-counter-qa.mjs'
      - 'tests/pizza-restaurant-access-browser-qa.cjs'
      - 'tests/pizza-catalog-qa.mjs'
      - 'tests/pizza-recipe-qa.mjs'
      - 'tests/pizza-quality-qa.mjs'
      - 'tests/pizza-city-gardens-qa.mjs'
      - 'tests/pizza-quality-browser-qa.cjs'
      - 'tests/pizza-menu-qa.mjs'
      - 'tests/pizza-menu-browser-qa.cjs'
      - 'tests/pizza-service-qa.mjs'
      - 'tests/pizza-service-browser-qa.cjs'
      - 'tests/pizza-service-recovery-qa.mjs'
      - 'tests/pizza-service-recovery-browser-qa.cjs'
      - 'tests/pizza-live-kitchen-qa.mjs'
      - 'tests/pizza-live-kitchen-browser-qa.cjs'
      - 'tests/pizza-machines-qa.mjs'
      - 'tests/pizza-machines-browser-qa.cjs'
      - 'tests/pizza-auto-equip-qa.mjs'
      - 'tests/pizza-auto-equip-browser-qa.cjs'
      - 'tests/pizza-staff-assignment-qa.mjs'
      - 'tests/pizza-staff-assignment-browser-qa.cjs'
      - 'tests/pizza-night-qa.mjs'
      - 'tests/pizza-procurement-qa.mjs'
      - 'tests/pizza-commerce-browser-qa.cjs'
      - 'tests/pizza-night-browser-qa.cjs'
      - 'tests/pizza-underworld-qa.mjs'
      - 'tests/pizza-underworld-browser-qa.cjs'
      - 'tests/pizza-market-qa.mjs'
      - 'tests/pizza-market-browser-qa.cjs'
      - 'tests/pizza-advertising-qa.mjs'
      - 'tests/pizza-advertising-browser-qa.cjs'
      - 'tests/pizza-taxis-capacity-qa.mjs'
      - 'tests/pizza-taxis-capacity-browser-qa.cjs'
      - 'tests/pizza-fruit-qa.mjs'
      - 'tests/pizza-fruit-browser-qa.cjs'
      - 'tests/pizza-properties-qa.mjs'
      - 'tests/pizza-city-layout-qa.mjs'
      - 'tests/pizza-city-study-qa.cjs'
      - 'tests/pizza-city-perimeter-qa.mjs'
      - 'tests/pizza-oldtown-study-browser-qa.cjs'
      - 'tests/pizza-city-mix-qa.cjs'
      - 'tests/pizza-city-height-qa.mjs'
      - 'tests/pizza-city-height-browser-qa.cjs'
      - 'tests/pizza-restaurants-browser-qa.cjs'
      - 'tests/pizza-staff-qa.mjs'
      - 'tests/pizza-staff-browser-qa.cjs'
      - 'tests/pizza-business-qa.mjs'
      - 'tests/pizza-business-browser-qa.cjs'
      - 'tests/pizza-daily-qa.mjs'
      - 'tests/pizza-daily-browser-qa.cjs'
      - 'tests/pizza-production-qa.mjs'
      - 'tests/pizza-production-browser-qa.cjs'
      - 'tests/pizza-shifts-qa.mjs'
      - 'tests/pizza-shifts-browser-qa.cjs'
      - 'tests/pizza-kitchen-qa.mjs'
      - 'tests/pizza-kitchen-browser-qa.cjs'
      - 'tests/pizza-floorplans-qa.mjs'
      - 'tests/pizza-floorplans-browser-qa.cjs'
      - 'tests/pizza-isometric-art-qa.mjs'
      - '.github/workflows/pizza-demo-qa.yml'
  workflow_dispatch:
jobs:
  pizza-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check the city, restaurant controls and responsive views
        run: |
          node tests/pizza-catalog-qa.mjs
          node tests/pizza-recipe-qa.mjs
          node tests/pizza-quality-qa.mjs
          node tests/pizza-city-gardens-qa.mjs
          node tests/pizza-quality-browser-qa.cjs
          node tests/pizza-menu-qa.mjs
          node tests/pizza-menu-browser-qa.cjs
          node tests/pizza-service-qa.mjs
          node tests/pizza-service-browser-qa.cjs
          node tests/pizza-service-recovery-qa.mjs
          node tests/pizza-service-recovery-browser-qa.cjs
          node tests/pizza-live-kitchen-qa.mjs
          node tests/pizza-live-kitchen-browser-qa.cjs
          node tests/pizza-machines-qa.mjs
          node tests/pizza-machines-browser-qa.cjs
          node tests/pizza-auto-equip-qa.mjs
          node tests/pizza-auto-equip-browser-qa.cjs
          node tests/pizza-staff-assignment-qa.mjs
          node tests/pizza-staff-assignment-browser-qa.cjs
          node tests/pizza-night-qa.mjs
          node tests/pizza-procurement-qa.mjs
          node tests/pizza-commerce-browser-qa.cjs
          node tests/pizza-night-browser-qa.cjs
          node tests/pizza-restaurants-browser-qa.cjs
          node tests/pizza-staff-qa.mjs
          node tests/pizza-staff-browser-qa.cjs
          node tests/pizza-business-qa.mjs
          node tests/pizza-counter-qa.mjs
          node tests/pizza-business-browser-qa.cjs
          node tests/pizza-daily-qa.mjs
          node tests/pizza-daily-browser-qa.cjs
          node tests/pizza-production-qa.mjs
          node tests/pizza-production-browser-qa.cjs
          node tests/pizza-shifts-qa.mjs
          node tests/pizza-shifts-browser-qa.cjs
          node tests/pizza-kitchen-qa.mjs
          node tests/pizza-kitchen-browser-qa.cjs
          node tests/pizza-floorplans-qa.mjs
          node tests/pizza-floorplans-browser-qa.cjs
          node tests/pizza-underworld-qa.mjs
          node tests/pizza-underworld-browser-qa.cjs
          node tests/pizza-market-qa.mjs
          node tests/pizza-market-browser-qa.cjs
          node tests/pizza-advertising-qa.mjs
          node tests/pizza-advertising-browser-qa.cjs
          node tests/pizza-taxis-capacity-qa.mjs
          node tests/pizza-taxis-capacity-browser-qa.cjs
          node tests/pizza-fruit-qa.mjs
          node tests/pizza-fruit-browser-qa.cjs
          node tests/pizza-properties-qa.mjs
          node tests/pizza-city-layout-qa.mjs
          node tests/pizza-isometric-art-qa.mjs
          node tests/pizza-city-height-qa.mjs
          node tests/pizza-city-height-browser-qa.cjs
          node tests/pizza-city-study-qa.cjs
          node tests/pizza-city-perimeter-qa.mjs
          node tests/pizza-oldtown-study-browser-qa.cjs
          node tests/pizza-city-mix-qa.cjs
          node tests/pizza-demo-qa.cjs
          node tests/pizza-editor-browser-qa.cjs
          node tests/pizza-restaurant-access-browser-qa.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pizza-demo-qa
          path: qa/pizza/
